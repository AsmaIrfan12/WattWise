services:
  # ── MQTT Password Init (one-shot) ────────────────────────
  mosquitto-init:
    image: eclipse-mosquitto:2
    container_name: wattwise-mosquitto-init
    restart: "no"
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_PI_PASSWORD=${MQTT_PI_PASSWORD:-WattWise_RPi_Dev_2026}
    volumes:
      - mosquitto_passwd_vol:/mosquitto/secret
    entrypoint: >
      sh -c "
        rm -f /mosquitto/secret/passwd &&
        mosquitto_passwd -b -c /mosquitto/secret/passwd $$MQTT_USERNAME $$MQTT_PASSWORD &&
        mosquitto_passwd -b /mosquitto/secret/passwd wattwise_rpi $$MQTT_PI_PASSWORD &&
        chmod 0755 /mosquitto/secret &&
        chmod 0644 /mosquitto/secret/passwd &&
        echo 'passwd file created successfully'
      "
    networks:
      - wattwise-network

  # ── MQTT Broker ──────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: wattwise-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # WebSocket
    volumes:
      - ./Server Side/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./Server Side/mosquitto/config/acl.conf:/mosquitto/config/acl.conf:ro
      - mosquitto_passwd_vol:/mosquitto/secret:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-u", "${MQTT_USERNAME}", "-P", "${MQTT_PASSWORD}", "-t", "$$SYS/broker/uptime", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - wattwise-network

  # ── MySQL Database ───────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: wattwise-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Server Side/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - wattwise-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── InfluxDB (Time-series energy telemetry) ──────────────
  influxdb:
    image: influxdb:1.8
    container_name: wattwise-influxdb
    restart: unless-stopped
    environment:
      INFLUXDB_DB: ${INFLUX_DB}
      INFLUXDB_HTTP_AUTH_ENABLED: "true"
      INFLUXDB_ADMIN_USER: ${INFLUX_USER}
      INFLUXDB_ADMIN_PASSWORD: ${INFLUX_PASS}
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - wattwise-network

  # ── DB Seed (one-shot, auto-exits) ───────────────────────
  db-seed:
    build:
      context: ./Server Side/backend
      dockerfile: Dockerfile
    container_name: wattwise-db-seed
    restart: "no"
    env_file:
      - ./Server Side/.env
    working_dir: /app
    command: python seed_participants.py
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wattwise-network

  # ── Bootstrap Aggregator (one-shot) ──────────────────────
  # Scans all existing energy_readings on every `compose up` and rebuilds
  # hourly_summary / daily_summary / home_daily_totals / energy_rankings
  # so the admin dashboard shows historical charts immediately without
  # waiting for the scheduled cron jobs to fire.
  bootstrap-aggregator:
    build:
      context: ./Server Side/backend
      dockerfile: Dockerfile
    container_name: wattwise-bootstrap-aggregator
    restart: "no"
    env_file:
      - ./Server Side/.env
    working_dir: /app
    command: python bootstrap_aggregator.py
    depends_on:
      backend:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully
    networks:
      - wattwise-network

  # ── Dummy Data Sender ── uncomment for local testing ─────────
  dummy-data-sender:
    build:
      context: .
      dockerfile: Dockerfile.dummy
    container_name: wattwise-dummy-sender
    restart: unless-stopped
    env_file:
      - ./Server Side/.env
    command: ["python", "dummy_data_sender.py", "--url", "http://wattwise-backend:8000", "--interval", "5", "--backfill-days", "2", "--csv", "participants.csv"]
    depends_on:
      backend:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully
    networks:
      - wattwise-network

  # ── FastAPI Backend ──────────────────────────────────────
  backend:
    build:
      context: ./Server Side/backend
      dockerfile: Dockerfile
    container_name: wattwise-backend
    restart: unless-stopped
    env_file:
      - ./Server Side/.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      mosquitto:
        condition: service_started
      influxdb:
        condition: service_started
    environment:
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - backups_data:/backups
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - wattwise-network

  # ── Admin Dashboard ──────────────────────────────────────
  admin-dashboard:
    build:
      context: ./Server Side/owner-frontend
      dockerfile: Dockerfile
    container_name: wattwise-admin-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - wattwise-network

  # ── User Web Dashboard ───────────────────────────────────
  user-dashboard:
    build:
      context: ./Server Side/user-frontend
      dockerfile: Dockerfile
    container_name: wattwise-user-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - wattwise-network

  # ── HTTPS Nginx Reverse Proxy (TLS termination) ──────────
  nginx-proxy:
    build:
      context: ./Server Side/nginx-proxy
      dockerfile: Dockerfile
    container_name: wattwise-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      admin-dashboard:
        condition: service_started
      user-dashboard:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - wattwise-network

  # ── MySQL Backup Service ──────────────────────────────────
  mysql-backup:
    image: mysql:8.0
    container_name: wattwise-mysql-backup
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wattwise_db}
    volumes:
      - backups_data:/backups
    entrypoint: >
      bash -c "
        echo 'WattWise backup service started';
        while true; do
          sleep 86400;
          if [ -f /backups/.backup_disabled ]; then
            echo 'Auto-backup disabled by admin flag — skipping';
          else
            BACKUP_FILE=/backups/wattwise-$$(date +%Y%m%d-%H%M%S).sql.gz;
            mysqldump -h mysql -u$$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE | gzip > $$BACKUP_FILE;
            echo \"Backup created: $$BACKUP_FILE\";
            find /backups -name '*.sql.gz' -mtime +30 -delete;
            echo 'Old backups (>30 days) cleaned';
          fi;
        done
      "
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - wattwise-network

volumes:
  mysql_data:
  mosquitto_data:
  mosquitto_log:
  mosquitto_passwd_vol:
  influxdb_data:
  letsencrypt:
  certbot_webroot:
  backups_data:

networks:
  wattwise-network:
    driver: bridge
