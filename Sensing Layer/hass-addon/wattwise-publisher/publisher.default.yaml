# WattWise RPi publisher — PLACEHOLDER config
# ==========================================
# Do not fill this in by hand. In the WattWise admin portal open
#   Devices / RPi  →  Add a home
# and paste the config it generates over this whole file
# (/config/wattwise_publisher.yaml), then set the InfluxDB password and restart the add-on.
#
# Until then the publisher will refuse to start: it has no home to publish as.

home:
  id: "REPLACE_WITH_CONFIG_FROM_ADMIN_PORTAL"
  name: "Unconfigured home"
  devices: []

influxdb:
  host: "localhost"
  port: 8086
  database: "homeassistant"
  username: "homeassistant"
  password: "REPLACE_WITH_INFLUXDB_PASSWORD"
  ssl: false

mqtt:
  host: "REPLACE_WITH_CONFIG_FROM_ADMIN_PORTAL"
  port: 1883
  transport: "tcp"
  ws_path: ""
  username: "REPLACE_WITH_CONFIG_FROM_ADMIN_PORTAL"
  password: "REPLACE_WITH_CONFIG_FROM_ADMIN_PORTAL"
  tls: false

publish_interval_seconds: 30
stale_after_seconds: 900
log_level: "INFO"
