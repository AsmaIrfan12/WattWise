name: WattWise CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/wattwise

jobs:
  # ── Backend Lint & Test ────────────────────────────────────────────
  test-backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server Side/backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root
          MYSQL_DATABASE: wattwise_test
          MYSQL_USER: wattwise
          MYSQL_PASSWORD: wattwise_test_pw
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install pytest pytest-asyncio httpx

      - name: Lint with ruff
        run: pip install ruff && ruff check app/ --ignore E501

      - name: Security audit (Python dependencies)
        run: pip install pip-audit && pip-audit -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: mysql+aiomysql://wattwise:wattwise_test_pw@localhost:3306/wattwise_test
          SECRET_KEY: ci_test_secret_key_minimum_32_chars_long
          MQTT_BROKER_HOST: localhost
          INFLUXDB_URL: http://localhost:8086
          INFLUXDB_TOKEN: ci_test_token
          INFLUXDB_ORG: wattwise
          INFLUXDB_BUCKET: energy_readings
        run: pytest tests/ -v --tb=short

  # ── Android Build ──────────────────────────────────────────────────
  build-android:
    name: Android — Build Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "User Apps/Android/WattWiseUserApp"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wattwise-debug-apk
          path: "User Apps/Android/WattWiseUserApp/app/build/outputs/apk/debug/*.apk"
          retention-days: 14

  # ── Android Release APK (signed, main branch only) ─────────────────
  release-android:
    name: Android — Signed Release APK
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [build-android]
    defaults:
      run:
        working-directory: "User Apps/Android/WattWiseUserApp"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Decode release keystore
        # Requires GitHub Secrets:
        #   RELEASE_KEYSTORE_BASE64 — base64 of wattwise-release.jks
        #   RELEASE_STORE_PASSWORD  — store password
        #   RELEASE_KEY_ALIAS       — key alias (default: wattwise)
        #   RELEASE_KEY_PASSWORD    — key password
        # Generate keystore once:
        #   keytool -genkeypair -v -keystore wattwise-release.jks \
        #     -keyalg RSA -keysize 2048 -validity 10000 -alias wattwise
        # Then: cat wattwise-release.jks | base64 -w 0
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "⚠️  RELEASE_KEYSTORE_BASE64 not set — producing debug-signed release APK"
          else
            echo "$KEYSTORE_B64" | base64 -d > wattwise-release.jks
            cat > keystore.properties << EOF
          storeFile=wattwise-release.jks
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF
            echo "✅ Keystore decoded and keystore.properties written"
          fi

      - name: Build signed Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wattwise-release-apk
          path: "User Apps/Android/WattWiseUserApp/app/build/outputs/apk/release/*.apk"
          retention-days: 30

  # ── Docker Build & Push ────────────────────────────────────────────
  build-docker:
    name: Docker — Build & Push Images
    runs-on: ubuntu-latest
    needs: [test-backend]
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push FastAPI Backend
        uses: docker/build-push-action@v5
        with:
          context: Server Side/backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Admin Dashboard
        uses: docker/build-push-action@v5
        with:
          context: Server Side/owner-frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push User Dashboard
        uses: docker/build-push-action@v5
        with:
          context: Server Side/user-frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-user:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Cloud ────────────────────────────────────────────────
  deploy:
    name: Deploy — Production Server
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /opt/wattwise
            PREV_COMMIT=$(git rev-parse HEAD)

            rollback() {
              echo "❌ Smoke check failed. Rolling back to ${PREV_COMMIT}"
              cd /opt/wattwise
              git reset --hard "${PREV_COMMIT}"
              cd "Server Side"
              docker compose up -d --build --remove-orphans
              sleep 5
              run_migrations || true
              python3 scripts/smoke_check.py --api-base http://localhost:8000 --admin-url http://localhost:3000 --user-url http://localhost:3001 --require-slo-ok || true
              exit 1
            }

            # Apply DB schema migrations. Retries while the backend/MySQL come
            # up; fails the deploy (triggering rollback) if migrations error.
            run_migrations() {
              echo "⏫ Running database migrations (alembic upgrade head)..."
              for i in $(seq 1 12); do
                if docker compose exec -T backend alembic upgrade head; then
                  echo "✅ Migrations applied"
                  return 0
                fi
                echo "  …backend/DB not ready (attempt $i/12), retrying in 5s"
                sleep 5
              done
              echo "❌ Migrations failed after retries"
              return 1
            }

            git fetch origin main
            git reset --hard origin/main

            cd "Server Side"
            docker compose up -d --build --remove-orphans
            sleep 5

            run_migrations || rollback

            python3 scripts/smoke_check.py --api-base http://localhost:8000 --admin-url http://localhost:3000 --user-url http://localhost:3001 --require-slo-ok || rollback

            docker system prune -f
            echo "✅ WattWise deployed and smoke-checked at $(date)"
