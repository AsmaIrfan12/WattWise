worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' fonts.googleapis.com fonts.gstatic.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; connect-src 'self';" always;

    # Rate limiting (more generous for users)
    limit_req_zone $binary_remote_addr zone=user_api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=user_auth:10m rate=10r/m;

    # ── User Dashboard (port 3001) ────────────────────────────────────
    server {
        listen 3001;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Ensure service worker and app shell updates are picked up immediately.
        location = /sw.js {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            try_files $uri =404;
        }

        location = /manifest.json {
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }

        location = /offline.html {
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }

        # API proxy to FastAPI
        location /api/ {
            limit_req zone=user_api burst=40 nodelay;
            proxy_pass         http://wattwise-backend:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /api/auth/ {
            limit_req zone=user_auth burst=5 nodelay;
            proxy_pass http://wattwise-backend:8000;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket proxy for real-time updates (future feature)
        location /ws/ {
            proxy_pass          http://wattwise-backend:8000;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_read_timeout  3600s;
        }
    }
}
