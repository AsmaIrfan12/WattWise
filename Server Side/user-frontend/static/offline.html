<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WattWise Offline</title>
<style>
:root { --bg:#0f172a; --panel:#1e293b; --text:#f8fafc; --muted:#94a3b8; --accent:#16a34a; }
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
  font-family: Inter, system-ui, sans-serif;
  background: radial-gradient(circle at 20% 20%, #1a2945, var(--bg));
  color:var(--text);
}
.card {
  width:min(520px, 100%);
  background:var(--panel);
  border:1px solid #334155;
  border-radius:16px;
  padding:24px;
  text-align:center;
}
h1 { margin:0 0 10px; font-size:1.4rem; color:var(--accent); }
p { margin:0; color:var(--muted); line-height:1.5; }
a {
  margin-top:16px;
  display:inline-block;
  color:#fff;
  background:var(--accent);
  text-decoration:none;
  padding:10px 14px;
  border-radius:10px;
  font-weight:600;
}
</style>
</head>
<body>
  <div class="card">
    <h1>WattWise is Offline</h1>
    <p>Your device is currently offline. Cached screens are still available, and fresh energy data will sync once the connection returns.</p>
    <a href="/">Try Again</a>
  </div>
</body>
</html>
