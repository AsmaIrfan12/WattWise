worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Security headers
    # The portal's page, script and stylesheet change on every deploy and carry no
    # version in their URLs. Without this, browsers guess a freshness lifetime from
    # Last-Modified and keep running the previous version for hours.
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options       "SAMEORIGIN" always;
    add_header X-XSS-Protection      "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy       "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' wss: ws:; frame-ancestors 'none';" always;

    # Rate limiting. The admin dashboard issues ~30 API calls on load and polls
    # several panels, so the API zone must be generous; only the login path is tight.
    # Excess requests get 429 (not nginx's default 503, which the UI showed as
    # "service temporarily unavailable").
    limit_req_zone $binary_remote_addr zone=api:10m rate=600r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
    limit_req_status 429;

    # Docker's embedded DNS. Together with "resolve" on each upstream server this makes
    # nginx follow a container to its new address when it is recreated (e.g. on a
    # redeploy of just that service). Without it nginx keeps the address it resolved at
    # startup and returns 502 until it is itself restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream fastapi_backend {
        zone fastapi_backend 64k;
        server wattwise-backend:8000 resolve;
        keepalive 16;
    }

    # ── Admin Dashboard (port 3000) ───────────────────────────────────
    server {
        listen 3000;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy API calls to FastAPI backend
        location /api/ {
            limit_req zone=api burst=300 nodelay;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_pass         http://fastapi_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://fastapi_backend;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
