# Mosquitto MQTT Broker — WattWise Production Configuration
# ==========================================================
# Author: Mr. Suhas Devmane, Cardiff University, UK
# Version: 2.0 (Community Deployment — AUTHENTICATED)

# ── Listeners ─────────────────────────────────────────────
# MQTT over TCP (internal services + RPi publishers)
listener 1883
protocol mqtt

# MQTT over WebSocket (browser clients / admin dashboard)
listener 9001
protocol websockets

# TLS-secured MQTT (production RPi publishers on internet)
# Uncomment when Let's Encrypt certs are set up:
#listener 8883
#protocol mqtt
#cafile /mosquitto/certs/ca.crt
#certfile /mosquitto/certs/server.crt
#keyfile /mosquitto/certs/server.key
#tls_version tlsv1.3
#require_certificate false

# ── Security ─────────────────────────────────────────────
# ⚠️  SECURITY WARNING: Anonymous access is currently ENABLED.
# This is suitable for isolated local/docker-internal networks only.
# For production internet-facing deployment:
#   1. Run: Server Side/mosquitto/scripts/setup_mqtt_passwords.sh
#   2. Comment out 'allow_anonymous true' below
#   3. Uncomment 'password_file' and 'acl_file' lines
#   4. Restart mosquitto: docker compose restart mosquitto
allow_anonymous true

# password_file /mosquitto/config/passwd   # re-enable for production
# acl_file /mosquitto/config/acl.conf      # re-enable for production

# Per-client limits
max_inflight_messages 20
max_queued_messages 100

# ── Persistence ──────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/
persistence_file wattwise.db
autosave_interval 60

# ── Logging ──────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ── Connection Limits ────────────────────────────────────
max_connections 200
max_keepalive 120
max_packet_size 262144      # 256 KB max payload

# Note: keepalive is negotiated per-client connection (client sets it, server honours it)
