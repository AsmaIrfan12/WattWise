# Mosquitto MQTT Broker — WattWise Production Configuration
# ==========================================================
# Author: Mr. Suhas Devmane, Cardiff University, UK
# Version: 2.1 (Community Deployment — AUTHENTICATED + SECURED)

# ── Listeners ─────────────────────────────────────────────
# MQTT over TCP (internal services + RPi publishers)
listener 1883
protocol mqtt

# MQTT over WebSocket (browser clients / admin dashboard)
listener 9001
protocol websockets

# TLS-secured MQTT (production RPi publishers on internet)
# Uncomment when Let's Encrypt certs are set up:
#listener 8883
#protocol mqtt
#cafile /mosquitto/certs/ca.crt
#certfile /mosquitto/certs/server.crt
#keyfile /mosquitto/certs/server.key
#tls_version tlsv1.3
#require_certificate false

# ── Security ─────────────────────────────────────────────
# SECURITY: Anonymous access is DISABLED.
# All clients must authenticate with username + password.
# Run: Server Side/mosquitto/scripts/setup_mqtt_passwords.sh
# to generate the password file before starting the broker.
allow_anonymous false

password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

# Per-client limits
max_inflight_messages 20
max_queued_messages 100

# ── Persistence ──────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/
persistence_file wattwise.db
autosave_interval 60

# ── Logging ──────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ── Connection Limits ────────────────────────────────────
max_connections 200
max_keepalive 120
max_packet_size 262144      # 256 KB max payload
