# WattWise MQTT Access Control List
# ==================================
# Controls which clients can publish/subscribe to which topics.
# Format: user <username>
#         topic [read|write|readwrite] <topic-pattern>
#
# Topic pattern: wattwise/homes/{home_id}/devices/{device_id}/data

# ── FastAPI Backend (full access) ───────────────────────
user wattwise_backend
topic readwrite wattwise/#
topic read $SYS/#

# ── Admin (read-only monitoring) ────────────────────────
user wattwise_admin
topic read wattwise/#
topic write wattwise/admin/#

# ── Home 001 (publish own data only) ────────────────────
user home_001
topic write wattwise/homes/home_001/#
topic read  wattwise/homes/home_001/commands/#

# ── Home 002 ───────────────────────────────────────────
user home_002
topic write wattwise/homes/home_002/#
topic read  wattwise/homes/home_002/commands/#

