worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    # By default nginx does NOT compress proxied responses; without this the
    # FastAPI JSON (the bulk of dashboard traffic) went over the wire raw.
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # ── Security headers ─────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # ── Rate limiting ────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # ── Upstream services ────────────────────────────────────────
    upstream fastapi_backend {
        server wattwise-backend:8000;
        keepalive 32;
    }
    upstream admin_frontend {
        server wattwise-admin-frontend:3000;
        keepalive 16;
    }
    upstream user_frontend {
        server wattwise-user-frontend:3001;
        keepalive 16;
    }

    # ── Main server block (HTTP — works for localhost and any IP) ─
    # server_name _ is a catch-all: works on localhost, any IP,
    # and any future domain without changing this file.
    server {
        listen 80 default_server;
        server_name _;

        # ── Admin dashboard (strip /admin prefix before forwarding) ─
        # Rate-limited to the same tight zone as auth endpoints so brute-force
        # attempts against the admin login are throttled at the proxy layer.
        location = /admin {
            return 301 /admin/;
        }
        location /admin/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://admin_frontend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # ── Auth endpoints (tighter rate limit) ──────────────────
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── All other API calls ───────────────────────────────────
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # ── Health check (no rate limit) ─────────────────────────
        location /health {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # ── WebSocket (real-time updates) ────────────────────────
        location /ws/ {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # ── MQTT over WebSocket (RPi publishers via port 80) ─────
        # RPi connects via ws://129.212.138.248/mqtt  OR
        #               via ws://localhost/mqtt  (dev)
        location /mqtt {
            proxy_pass http://wattwise-mosquitto:9001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── User Dashboard ────────────────────────────────────────
        location / {
            proxy_pass http://user_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ── HTTPS server block (uncomment when domain + certbot ready) ─
    # server {
    #     listen 443 ssl;
    #     server_name YOUR_DOMAIN;
    #     ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    #     include /etc/letsencrypt/options-ssl-nginx.conf;
    #     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    #     # Copy all location blocks from the HTTP server above
    # }
}
