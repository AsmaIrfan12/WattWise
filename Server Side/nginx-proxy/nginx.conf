worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # ── Security headers (applied globally) ──────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Rate limiting ────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # ── Upstream services (Docker internal hostnames) ────────────
    upstream fastapi_backend {
        server wattwise-backend:8000;
        keepalive 32;
    }
    upstream admin_frontend {
        server wattwise-admin-frontend:3000;
    }
    upstream user_frontend {
        server wattwise-user-frontend:3001;
    }

    # ── Cloudflare Tunnel entry point (talk2futurebuildings.systems) ──
    # Cloudflare terminates TLS externally and forwards plain HTTP here on
    # port 80. This block handles all traffic for the production domain.
    # Point your Cloudflare Tunnel to: http://localhost:80
    server {
        listen 80;
        server_name talk2futurebuildings.systems www.talk2futurebuildings.systems;

        # ── Auth endpoints (tighter rate limit) ──────────────────
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ── All other API calls → FastAPI backend ────────────────
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        # ── Health check (no rate limit) ─────────────────────────
        location /health {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
        }

        # ── WebSocket (future real-time updates) ─────────────────
        location /ws/ {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # ── MQTT over WebSocket (RPi publishers → Mosquitto) ─────
        # RPi connects via wss://talk2futurebuildings.systems/mqtt
        # Cloudflare terminates TLS; nginx forwards plain WS to mosquitto:9001
        location /mqtt {
            proxy_pass http://wattwise-mosquitto:9001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── User Dashboard (WebView content) ─────────────────────
        location / {
            proxy_pass http://user_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # ── Catch-all fallback (blocks unrecognised hostnames) ────────
    server {
        listen 80 default_server;
        server_name _;
        return 444;   # close connection silently
    }
}
