[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# WattWise database URL — overridden by env.py from settings
sqlalchemy.url = mysql+pymysql://wattwise:CHANGE_ME@wattwise-mysql:3306/wattwise_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %%H:%%M:%%S
